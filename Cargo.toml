[workspace]
resolver = "3"
members = [
    "crates/snp-ligase-core",
    "crates/snp-ligase-platform",
    "crates/snp-ligase-app",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
publish = false

# Shared dependency versions. Every crate takes its versions from here so the
# whole workspace resolves to one copy of each crate.
[workspace.dependencies]
# Internal crates.
snp-ligase-core = { path = "crates/snp-ligase-core" }
snp-ligase-platform = { path = "crates/snp-ligase-platform" }

# GUI.
eframe = "0.36.2"
egui = "0.36.2"
# The X11 overlay child's window and pixel blitting (LINUX_SUPPORT.md L1b).
# The version is the one eframe 0.36.2 resolves, so the whole workspace uses
# one winit. softbuffer is MIT OR Apache-2.0, like winit (DECISIONS.md).
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11"] }
softbuffer = { version = "0.4.8", default-features = false, features = ["x11"] }

# 2D rasterizer (CPU, anti-aliased paths).
tiny-skia = "0.12.0"

# Text shaping, layout and glyph rasterization.
cosmic-text = "0.19.0"

# Image buffers and codecs. The default feature set is off at the workspace
# level so each member enables exactly the formats it uses; snp-ligase-core
# owns the codec list of SPEC section 9.
image = { version = "0.25.10", default-features = false }
zune-jpegxl = "0.5.2"
# zune-jpegxl's option types (EncoderOptions, ColorSpace, BitDepth) live here;
# it is the same zune family and the same MIT/Apache-2.0/Zlib license.
zune-core = "0.5.3"
# AGPL-3.0. Only ever used behind the app's `jxl-lossy` feature, which is OFF by
# default and must not be enabled without the human's approval (SPEC section 3).
jxl-encoder = "0.3.1"
jxl-oxide = "0.12.6"

# Half floats, for HDR capture frames.
half = "2.7.1"

# Windows-specific crates (used by snp-ligase-platform and the app).
windows-capture = "2.0.1"
windows = "0.62.2"
global-hotkey = "0.8.0"
tray-icon = "0.26.1"
arboard = "3.6.1"
rfd = "0.17.2"

# Configuration.
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
directories = "6.0.0"
chrono = "0.4.45"

# Unix system calls: geteuid for the instance channel's fallback directory, and
# the System V shared memory the X11 capture's MIT-SHM path uses.
libc = "0.2.190"
# X11 protocol bindings for the Linux backend (LINUX_SUPPORT.md section 8).
# MIT OR Apache-2.0. The features are chosen per crate, not least because
# another crate's features must never be what makes ours compile.
x11rb = "0.13.2"

# XDG desktop portals for the KDE Wayland backend (LINUX_SUPPORT.md section 8).
# ashpd is MIT; its async-io backend runs on async-io (Apache-2.0 OR MIT).
# Normal Linux dependencies since the L3b backend (S1: the Screenshot portal).
ashpd = { version = "0.13.13", default-features = false, features = [
    "async-io",
    "global_shortcuts",
    "screenshot",
] }
async-io = "2.6.0"
futures-lite = "2.6.1"

# The Wayland output layout probe (LINUX_SUPPORT.md section 6, L3b): the
# output's logical position/size and its physical mode, which winit reports
# wrong for mixed-scale desktops. wayland-client is MIT; wayland-protocols is
# MIT and carries xdg_output behind its `unstable` feature.
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", default-features = false, features = [
    "client",
    "unstable",
] }

# Errors and logging.
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-appender = "0.2.5"

# Windows resource / manifest embedding for the app build script.
embed-manifest = "1.5.1"
winresource = "0.1.31"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
